<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BitcoinII Dashboard Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Base theme (light) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />

  <!-- Modern custom skin -->
  <link rel="stylesheet" href="./_style.css" />
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: "BitcoinII Dashboard",
      repo: "https://github.com/kleokzwo/health_check",

      // sidebar
      loadSidebar: true,
      subMaxLevel: 3,

      // search
      search: {
        placeholder: "Search docs…",
        noData: "No results",
        depth: 3
      },

      // better relative paths on GitHub Pages
      relativePath: true,

      // nicer scroll + URLs
      auto2top: true,
      topMargin: 10
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
