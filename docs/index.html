<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BitcoinII Dashboard Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme (change to vue.css / buble.css / dark.css if you want) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        body { background: rgb(240,240,245); }
        .sidebar, .content { background: transparent; }
    </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: "BitcoinII Dashboard",
      repo: "https://github.com/kleokzwo/health_check",
      loadSidebar: true,
      subMaxLevel: 3,
      search: "auto",
      relativePath: true
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
